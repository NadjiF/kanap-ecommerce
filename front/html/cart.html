<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mon panier — Kanap</title>
    <meta name="description" content="Finalisez votre commande de canapés Kanap. Vérifiez votre panier et renseignez vos coordonnées de livraison.">
    <meta name="robots" content="noindex, nofollow">

    <meta property="og:title" content="Kanap — e-commerce de canapés">
    <meta property="og:description" content="Boutique en ligne de canapés design.">
    <meta property="og:type" content="website">

    <!-- <link rel="icon" type="image/png" href="../images/favicon.png"> -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/cart.css" rel="stylesheet">
  </head>

  <body>
    <header>
      <div class="limitedWidthBlockContainer informations">
        <div class="limitedWidthBlock">
          <ul>
            <li><img src="../images/icons/phone.svg" alt="" class="informations__phone">01 23 45 67 89</li>
            <li><img src="../images/icons/mail.svg" alt="" class="informations__mail">support@kanap.com</li>
            <li><img src="../images/icons/adress.svg" alt="" class="informations__address">10 quai de la Charente, 75019 Paris</li>
          </ul>
        </div>
      </div>
      <div class="limitedWidthBlockContainer menu">
        <div class="limitedWidthBlock">
          <a href="../../index.html" aria-label="Retour à l'accueil Kanap">
            <img class="logo" src="../images/logo.png" alt="Logo Kanap">
          </a>
          <nav aria-label="Navigation principale">
            <ul>
              <li><a href="../../index.html">Accueil</a></li>
              <li><a href="./cart.html" aria-current="page">Panier</a></li>
            </ul>
          </nav>
        </div>
      </div>
      <img class="banniere" src="../images/banniere.PNG" alt="">
    </header>

    <main class="limitedWidthBlockContainer" aria-label="Panier et formulaire de commande">
      <div class="limitedWidthBlock" id="limitedWidthBlock">
        <div class="cartAndFormContainer" id="cartAndFormContainer">
          <h1>Votre panier</h1>

          <section class="cart">
            <section id="cart__items" aria-live="polite">
              <!-- Items injectés par cart.js -->
            </section>

            <div class="cart__price">
              <p>Total (<span id="totalQuantity">0</span> articles) : <span id="totalPrice">0</span> €</p>
            </div>

            <div class="cart__order">
              <form method="post" class="cart__order__form" novalidate>
                <div class="cart__order__form__question">
                  <label for="firstName">Prénom :</label>
                  <input type="text" name="firstName" id="firstName" autocomplete="given-name" required>
                  <p id="firstNameErrorMsg"></p>
                </div>
                <div class="cart__order__form__question">
                  <label for="lastName">Nom :</label>
                  <input type="text" name="lastName" id="lastName" autocomplete="family-name" required>
                  <p id="lastNameErrorMsg"></p>
                </div>
                <div class="cart__order__form__question">
                  <label for="address">Adresse :</label>
                  <input type="text" name="address" id="address" autocomplete="street-address" required>
                  <p id="addressErrorMsg"></p>
                </div>
                <div class="cart__order__form__question">
                  <label for="city">Ville :</label>
                  <input type="text" name="city" id="city" autocomplete="address-level2" required>
                  <p id="cityErrorMsg"></p>
                </div>
                <div class="cart__order__form__question">
                  <label for="email">Email :</label>
                  <input type="email" name="email" id="email" autocomplete="email" required>
                  <p id="emailErrorMsg"></p>
                </div>
                <div class="cart__order__form__submit">
                  <input type="submit" value="Commander !" id="order">
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>

    <footer>
      <div class="limitedWidthBlockContainer footerMain">
        <div class="limitedWidthBlock">
          <div>
            <img class="logo" src="../images/logo.png" alt="Logo Kanap">
          </div>
          <div>
            <p>10 quai de la Charente<br>75019 Paris</p>
          </div>
          <div>
            <p>Téléphone : 01 23 45 67 89</p>
          </div>
          <div>
            <p>Email : support@kanap.com</p>
          </div>
        </div>
      </div>
      <div class="limitedWidthBlockContainer footerSecondary">
        <div class="limitedWidthBlock">
          <p>© Kanap — Projet pédagogique de Nadji Fali</p>
        </div>
      </div>
    </footer>

    <script src="../js/cart.js"></script>
  </body>
</html>
