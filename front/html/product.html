<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Produit — Kanap</title>
    <meta name="description" content="Découvrez ce canapé Kanap. Choisissez sa couleur, sa quantité et ajoutez-le à votre panier.">

    <meta property="og:title" content="Kanap — e-commerce de canapés">
    <meta property="og:description" content="Boutique en ligne de canapés design.">
    <meta property="og:type" content="product">

    <!-- <link rel="icon" type="image/png" href="../images/favicon.png"> -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/product.css" rel="stylesheet">
  </head>

  <body>
    <header>
      <div class="limitedWidthBlockContainer informations">
        <div class="limitedWidthBlock">
          <ul>
            <li><img src="../images/icons/phone.svg" alt="" class="informations__phone">01 23 45 67 89</li>
            <li><img src="../images/icons/mail.svg" alt="" class="informations__mail">support@kanap.com</li>
            <li><img src="../images/icons/adress.svg" alt="" class="informations__address">10 quai de la Charente, 75019 Paris</li>
          </ul>
        </div>
      </div>
      <div class="limitedWidthBlockContainer menu">
        <div class="limitedWidthBlock">
          <a href="../../index.html" aria-label="Retour à l'accueil Kanap">
            <img class="logo" src="../images/logo.png" alt="Logo Kanap">
          </a>
          <nav aria-label="Navigation principale">
            <ul>
              <li><a href="../../index.html">Accueil</a></li>
              <li><a href="./cart.html">Panier</a></li>
            </ul>
          </nav>
        </div>
      </div>
      <img class="banniere" src="../images/banniere.PNG" alt="">
    </header>

    <main class="limitedWidthBlockContainer" aria-label="Fiche produit">
      <div class="limitedWidthBlock">
        <section class="item">
          <article>
            <div class="item__img" aria-live="polite">
              <!-- Image injectée par product.js -->
            </div>
            <div class="item__content">

              <div class="item__content__titlePrice">
                <h1 id="title"></h1>
                <p>Prix : <span id="price"></span> €</p>
              </div>

              <div class="item__content__description">
                <p class="item__content__description__title">Description :</p>
                <p id="description"></p>
              </div>

              <div class="item__content__settings">
                <div class="item__content__settings__color">
                  <label for="colors">Choisir une couleur :</label>
                  <select name="color-select" id="colors" required>
                    <option value="">-- Choisissez une couleur --</option>
                  </select>
                </div>

                <div class="item__content__settings__quantity">
                  <label for="quantity">Nombre d'articles (1-100) :</label>
                  <input type="number" name="itemQuantity" min="1" max="100" value="1" id="quantity">
                </div>
              </div>

              <div class="item__content__addButton">
                <button id="addToCart" type="button">Ajouter au panier</button>
              </div>

            </div>
          </article>
        </section>
      </div>
    </main>

    <footer>
      <div class="limitedWidthBlockContainer footerMain">
        <div class="limitedWidthBlock">
          <div>
            <img class="logo" src="../images/logo.png" alt="Logo Kanap">
          </div>
          <div>
            <p>10 quai de la Charente<br>75019 Paris</p>
          </div>
          <div>
            <p>Téléphone : 01 23 45 67 89</p>
          </div>
          <div>
            <p>Email : support@kanap.com</p>
          </div>
        </div>
      </div>
      <div class="limitedWidthBlockContainer footerSecondary">
        <div class="limitedWidthBlock">
          <p>© Kanap — Projet pédagogique de Nadji Fali</p>
        </div>
      </div>
    </footer>

    <script src="../js/product.js"></script>
  </body>
</html>
